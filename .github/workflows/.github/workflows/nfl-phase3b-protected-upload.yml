name: NFL Phase 3B Protected Upload

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview reads and compares; upload may update ONLY 2026 statistics'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - upload
      confirmation:
        description: 'For upload only, enter UPLOAD_2026_STATS exactly'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nfl-phase3b-stats-write
  cancel-in-progress: false

jobs:
  protected:
    name: Backup, validate and optionally update 2026 statistics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify explicit upload confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          if [ "$MODE" = "upload" ] && [ "$CONFIRM" != "UPLOAD_2026_STATS" ]; then
            echo 'Upload blocked: confirmation does not match.'
            exit 1
          fi
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install export dependencies
        run: pip install -r requirements-phase3.txt
      - name: Back up and validate existing Supabase statistics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backup_stats.py
      - name: Retain pre-update backup artifact (must succeed)
        uses: actions/upload-artifact@v4
        with:
          name: nfl-stat-exports-2026-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup_artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Generate new NFL statistics export
        run: python export.py
      - name: Compare and optionally update ONLY 2026 statistics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ARTIFACT_UPLOADED: 'true'
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirmation }}
        run: python scripts/protected_stats_upload.py --mode "$MODE" --confirm "$CONFIRM"
