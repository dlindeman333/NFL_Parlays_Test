name: NFL Phase 3D27-29 Consolidated Automation Development Preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh ESPN injury and schedule preview
        run: python scripts/phase3c3d22_initial_load_preview.py
      - name: Evaluate storage safeguards
        run: python scripts/phase3c3d23_storage_decision_preview.py
      - name: Compare live Supabase injury rows (GET only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3c3d24_live_db_comparison.py
      - name: Build non-executable candidate manifest
        run: python scripts/phase3c3d25_backup_authorization_preview.py
      - name: Test injury, pregame, and postgame automation gates
        run: python scripts/phase3d27_29_automation_gates.py
      - name: Upload sanitized diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d27-29-automation-development-preview
          path: |
            phase3d27-29-report/
            phase3c3d25-report/audit.json
            phase3c3d24-report/audit.json
            phase3c3d23-report/audit.json
            phase3c3d22-report/audit.json
          if-no-files-found: warn
