name: NFL Phase 3D37H Full Candidate Manifest (Read Only)
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (blank = current ESPN regular season)'
        required: false
        type: string
      week:
        description: 'Week (blank = current ESPN regular season week)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nfl-phase3d37h-readonly
  cancel-in-progress: false
jobs:
  full-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_phase3d37h_full_manifest.py' -v
      - name: Generate full read-only manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: ${{ inputs.season }}
          NFL_WEEK: ${{ inputs.week }}
        shell: bash
        run: |
          args=()
          if [[ -n "$NFL_SEASON" ]]; then args+=(--season "$NFL_SEASON"); fi
          if [[ -n "$NFL_WEEK" ]]; then args+=(--week "$NFL_WEEK"); fi
          python scripts/phase3d37h_full_manifest.py "${args[@]}"
      - name: Upload immutable run evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d37h-full-manifest-${{ github.run_id }}
          path: phase3d37h-output/
          retention-days: 30
          if-no-files-found: error
