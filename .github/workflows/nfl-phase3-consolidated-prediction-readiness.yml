name: NFL Phase 3 Consolidated Prediction Readiness (TEST, Read Only)
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (blank = current ESPN season)'
        required: false
        type: string
      week:
        description: 'Week (blank = current ESPN week)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nfl-phase3-consolidated-prediction-readiness
  cancel-in-progress: false
jobs:
  consolidated-readiness:
    if: github.repository == 'dlindeman333/NFL_Parlays_Test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated offline unit tests
        run: |
          python -m unittest discover -s scripts -p 'test_phase3d37b_roster_match.py' -v
          python -m unittest discover -s scripts -p 'test_phase3d37h_full_manifest.py' -v
          python -m unittest discover -s scripts -p 'test_phase3d37j_storage_dry_run.py' -v
          python -m unittest discover -s scripts -p 'test_phase3d37k_pick_compat_audit.py' -v
          python -m unittest discover -s scripts -p 'test_phase3d37l_serializer_dry_run.py' -v
          python -m unittest discover -s scripts -p 'test_phase3_espn_retry.py' -v
      - name: Verify TEST-only database boundary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python scripts/phase3_test_boundary.py
      - name: Generate authenticated read-only pregame candidate manifest
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: ${{ inputs.season }}
          NFL_WEEK: ${{ inputs.week }}
        run: |
          args=()
          if [[ -n "$NFL_SEASON" ]]; then args+=(--season "$NFL_SEASON"); fi
          if [[ -n "$NFL_WEEK" ]]; then args+=(--week "$NFL_WEEK"); fi
          python scripts/phase3d37h_full_manifest.py "${args[@]}"
      - name: Existing snapshot storage compatibility (GET only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3d37j_storage_dry_run.py
      - name: Existing pick JSON shape audit (GET only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3d37k_pick_compat_audit.py
      - name: Candidate serialization contract (offline, no betting picks)
        run: python scripts/phase3d37l_serializer_dry_run.py
      - name: Upload consolidated non-sensitive readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-consolidated-readiness-${{ github.run_id }}
          path: |
            phase3d37h-output/manifest.json
            phase3d37j-output/storage_dry_run.json
            phase3d37k-output/pick_compatibility_audit.json
            phase3d37l-output/serializer_contract_report.json
          retention-days: 30
          if-no-files-found: warn
