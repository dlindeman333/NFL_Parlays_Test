name: NFL Phase 3C-1 Pregame Validation (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 2026 upcoming games (no database writes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3c_validate.py
      - name: Save validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c1-validation-report
          path: phase3c-report/validation.json
          if-no-files-found: warn
          retention-days: 30
