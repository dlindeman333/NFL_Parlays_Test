name: NFL Phase 3 Consolidated TEST Release Gate
on:
  workflow_dispatch:
    inputs:
      run_write_isolation:
        description: "Run disposable TEST parlay write-isolation checks (modifies only TEST disposable rows)"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  offline-release-gate:
    if: github.repository == 'dlindeman333/NFL_Parlays_Test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app JavaScript syntax without cloud access
        run: python scripts/phase3_release_static_check.py
      - name: Run complete Python regression suite
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s scripts -p 'test_*.py' -q
  authenticated-test-readonly:
    needs: offline-release-gate
    if: github.repository == 'dlindeman333/NFL_Parlays_Test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate authenticated TEST owner isolation (read-only)
        env:
          NFL_TEST_SUPABASE_URL: https://luxezjthznupdghmexyh.supabase.co
          NFL_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NFL_TEST_SUPABASE_PUBLISHABLE_KEY }}
          NFL_TEST_USER_A_EMAIL: ${{ secrets.NFL_TEST_USER_A_EMAIL }}
          NFL_TEST_USER_A_PASSWORD: ${{ secrets.NFL_TEST_USER_A_PASSWORD }}
          NFL_TEST_USER_B_EMAIL: ${{ secrets.NFL_TEST_USER_B_EMAIL }}
          NFL_TEST_USER_B_PASSWORD: ${{ secrets.NFL_TEST_USER_B_PASSWORD }}
        run: python scripts/phase3_tracking_live_smoke.py

  authenticated-test-write-isolation:
    needs: authenticated-test-readonly
    if: github.repository == 'dlindeman333/NFL_Parlays_Test' && inputs.run_write_isolation == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify disposable TEST-only parlay write isolation and negative tracking writes
        env:
          NFL_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NFL_TEST_SUPABASE_PUBLISHABLE_KEY }}
          NFL_TEST_USER_A_EMAIL: ${{ secrets.NFL_TEST_USER_A_EMAIL }}
          NFL_TEST_USER_A_PASSWORD: ${{ secrets.NFL_TEST_USER_A_PASSWORD }}
          NFL_TEST_USER_B_EMAIL: ${{ secrets.NFL_TEST_USER_B_EMAIL }}
          NFL_TEST_USER_B_PASSWORD: ${{ secrets.NFL_TEST_USER_B_PASSWORD }}
          NFL_TEST_ALLOW_WRITE_ISOLATION: YES_TEST_ONLY
        run: python scripts/nfl_phase3_api_isolation.py

  operational-readiness:
    needs: offline-release-gate
    if: github.repository == 'dlindeman333/NFL_Parlays_Test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate offline postgame readiness (no credentials or writes)
        env:
          PYTHONPATH: scripts
        run: python scripts/phase3_postgame_artifact_pipeline.py --output-dir operational-readiness
      - name: Generate live read-only injury readiness (not a completed sync)
        env:
          PYTHONPATH: scripts
          NFL_PHASE3_INJURY_REPORT: operational-readiness/phase3-injury-preview-report.json
          NFL_PHASE3_INJURY_VALIDATED_OUTPUT: operational-readiness/phase3-injury-validated-observations.json
          NFL_PHASE3_INJURY_FEED_URL: ${{ vars.NFL_PHASE3_INJURY_FEED_URL }}
          NFL_PHASE3_INJURY_FEED_HOST: ${{ vars.NFL_PHASE3_INJURY_FEED_HOST }}
        run: python scripts/phase3_weekly_injury_preview.py
      - name: Upload operational readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-phase3-operational-readiness
          path: operational-readiness/*.json
          if-no-files-found: warn
