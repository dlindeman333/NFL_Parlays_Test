name: NFL Phase 3C-3D1 Protected Writer Preview (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only writer preview
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3c3d1_writer_preview.py
      - name: Upload preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c3d1-writer-preview-report
          path: phase3c3d1-report/
          if-no-files-found: error
          retention-days: 30
