
name: NFL Phase 3C-2B Formula Parity (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run parity diagnostics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3c2b_parity.py

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c2b-parity-report
          path: phase3c2b-report/
          if-no-files-found: warn
          retention-days: 30
