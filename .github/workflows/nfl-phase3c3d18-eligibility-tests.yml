name: NFL Phase 3C-3D18 Eligibility Rule Tests (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline eligibility rule tests
        run: python scripts/phase3c3d18_eligibility_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3c3d18-eligibility-tests-report
          path: phase3c3d18-report/
          if-no-files-found: warn
