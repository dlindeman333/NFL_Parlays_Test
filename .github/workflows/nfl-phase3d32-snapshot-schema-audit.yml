name: NFL Phase 3D32 Snapshot and Schema Audit (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfl-phase3d32-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run local tests
        run: python -m unittest discover -s scripts -p 'test_phase3d32*.py' -v
      - name: Audit live tables using GET only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3d32_snapshot_audit.py
      - name: Upload metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d32-snapshot-schema-audit
          path: phase3d32-report/audit.json
          retention-days: 7
          if-no-files-found: warn
