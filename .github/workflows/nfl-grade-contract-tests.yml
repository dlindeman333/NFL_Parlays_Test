name: NFL Grade Contract - Consolidated Tests (No Writes)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/nfl_grade_contract.py'
      - 'scripts/nfl_grade_writer.py'
      - 'scripts/test_nfl_grade_contract.py'
      - '.github/workflows/nfl-grade-contract-tests.yml'
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify grade contract and disabled writes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_nfl_grade_contract.py' -v
