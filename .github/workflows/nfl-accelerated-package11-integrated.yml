name: NFL Accelerated Package 11 - Integrated Grade Plan (Read Only)
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (optional; supply with week)'
        required: false
        default: ''
      week:
        description: 'Week (optional; supply with season)'
        required: false
        default: ''
  schedule:
    - cron: '27 11,23 * * 0,1,2'
permissions:
  contents: read
concurrency:
  group: nfl-integrated-grade-plan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  grade-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NFL_SEASON: ${{ inputs.season }}
      NFL_WEEK: ${{ inputs.week }}
      ENABLE_GRADE_WRITES: 'false'
      ENABLE_PREDICTION_WRITES: 'false'
      ENABLE_INJURY_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consolidated tests
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_nfl_package11.py' -v
      - name: Generate integrated grading plan
        run: python scripts/nfl_package11_integrated.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-package11-integrated-${{ github.run_id }}
          path: package11-output/integrated_grade_plan.json
          if-no-files-found: warn
          retention-days: 14
