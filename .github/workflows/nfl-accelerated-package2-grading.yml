name: NFL Accelerated Package 2 - Grading Contract Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grading-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run strict grading contract tests (offline; no secrets)
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_nfl_readonly_grader.py' -v
