name: NFL Phase 3C-3D14 Inactive Source Probe (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inactive-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only probe
        run: python scripts/phase3c3d14_inactive_source_probe.py
      - name: Upload evidence (even on partial failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c3d14-inactive-source-probe-report
          path: phase3c3d14-report/
          if-no-files-found: warn
