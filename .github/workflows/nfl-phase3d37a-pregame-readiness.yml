name: NFL Phase 3D37A Pregame Readiness (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s scripts -p 'test_phase3d37_prediction_readiness.py' -v
      - name: Generate read-only pregame readiness report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: '2026'
        run: python scripts/phase3d37_prediction_readiness.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d37a-pregame-readiness
          path: phase3d37a_readiness.json
          if-no-files-found: warn
          retention-days: 7
