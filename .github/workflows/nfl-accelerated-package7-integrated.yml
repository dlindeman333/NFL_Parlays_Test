name: NFL Accelerated Package 7 - Integrated Grading Preview
on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: '2026'
      week:
        description: NFL week
        required: true
        default: '9'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NFL_SEASON: ${{ inputs.season }}
      NFL_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consolidated grading tests
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_nfl_package7_integrated_preview.py' -v
      - name: Produce integrated read-only grading preview
        run: python scripts/nfl_package7_integrated_preview.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-package7-integrated-${{ github.run_id }}
          path: package7-output/integrated_grade_preview.json
          if-no-files-found: warn
          retention-days: 14
