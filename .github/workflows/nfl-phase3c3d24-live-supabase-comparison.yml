name: NFL Phase 3C-3D24 Live Supabase Comparison (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh Phase 3D22 ESPN evidence (GET only)
        run: python scripts/phase3c3d22_initial_load_preview.py
      - name: Run Phase 3D23 safeguard preview
        run: python scripts/phase3c3d23_storage_decision_preview.py
      - name: Compare against live Supabase injury table (GET only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3c3d24_live_db_comparison.py
      - name: Upload report even if comparison fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c3d24-live-supabase-comparison-report
          path: |
            phase3c3d24-report/
            phase3c3d23-report/audit.json
            phase3c3d22-report/audit.json
          if-no-files-found: warn
