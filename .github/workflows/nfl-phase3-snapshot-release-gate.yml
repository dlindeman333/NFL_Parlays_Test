name: NFL Phase 3 Snapshot Provenance Gate (Read Only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/phase3_snapshot_release_gate.py'
      - 'scripts/test_phase3_snapshot_release_gate.py'
      - '.github/workflows/nfl-phase3-snapshot-release-gate.yml'
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fail-closed snapshot gate
        run: python -m unittest discover -s scripts -p 'test_phase3_snapshot_release_gate.py' -v
