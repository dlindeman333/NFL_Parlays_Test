name: NFL Comprehensive V4 TEST
on:
  push:
    branches: [main]
    paths: ['.github/workflows/comprehensive-v4-test.yml']
  schedule:
    - cron: '*/5 * * * *'
    - cron: '11 */3 * * *'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [refresh-and-grade, capture]
        required: true
permissions:
  contents: read
concurrency:
  group: comprehensive-v4-test
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'dlindeman333/NFL_Parlays_Test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      NFL_SEASON: '2026'
      NFL_V4_SUPABASE_URL: https://luxezjthznupdghmexyh.supabase.co
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dlindeman333/NFL_Parlays
          ref: 276723c0d4037e95166983a3250bc71e1e1a2070
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover upcoming kickoffs
        id: prep
        if: github.event.schedule == '*/5 * * * *' || inputs.task == 'capture'
        run: python snapshot_predictions.py --check-prep-window
      - name: Warm Chromium and wait for the strict capture window
        id: window
        if: steps.prep.outputs.eligible == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python snapshot_predictions.py --wait-for-window
      - name: Publish authentic TEST capture
        if: steps.window.outputs.eligible == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NFL_V4_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test "${SUPABASE_URL%/}" = "$NFL_V4_SUPABASE_URL"
          test -n "$NFL_V4_SERVICE_ROLE_KEY"
          python -m phase3.comprehensive_worker capture
      - name: Refresh TEST statistics and injuries, then grade
        if: github.event_name == 'push' || github.event.schedule == '11 */3 * * *' || inputs.task == 'refresh-and-grade'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_V4_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test "${SUPABASE_URL%/}" = "$NFL_V4_SUPABASE_URL"
          test -n "$NFL_V4_SERVICE_ROLE_KEY"
          python -m pip install -r requirements-automation.txt
          python export_automated.py
          python -m phase3.comprehensive_worker injuries
          python -m phase3.comprehensive_worker grade
