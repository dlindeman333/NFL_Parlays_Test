name: NFL Phase 3D37E Source Evidence Capture (Read Only)
on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: '2026'
      week:
        description: NFL week
        required: true
        default: '10'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_phase3d37e_capture.py' -v
      - name: Capture current source export (GET only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3d37e_capture.py --season "${{ inputs.season }}" --week "${{ inputs.week }}"
      - name: Verify captured file integrity
        run: python scripts/phase3d37e_capture.py --verify
      - name: Test capture-chain readiness audit
        run: python -m unittest discover -s scripts -p 'test_phase3_capture_chain_readiness.py' -v
      - name: Audit captured artifact (read-only; never certifies pregame)
        run: python scripts/phase3_capture_chain_readiness.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phase3d37e-source-evidence
          path: phase3d37e-evidence/
          if-no-files-found: error
          retention-days: 30
