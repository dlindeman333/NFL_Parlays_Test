name: NFL Phase 3C-3D21 Initial Injury Load Preview (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preview initial load without Supabase credentials
        run: python scripts/phase3c3d21_initial_load_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3c3d21-initial-load-preview-report
          path: phase3c3d21-report/
          if-no-files-found: error
