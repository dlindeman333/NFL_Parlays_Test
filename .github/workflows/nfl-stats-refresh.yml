name: NFL stats refresh (Phase 3A)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-phase3.txt

      - name: Install exporter dependencies
        run: pip install -r requirements-phase3.txt

      - name: Export weekly NFL stats
        run: python export.py

      - name: Verify exported CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("nfl_player_stats.csv")
          assert path.exists(), "Export file not found"

          with path.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              required = {
                  "season", "week", "game_status",
                  "player_id", "team", "pass_yards",
                  "rush_yards", "receptions", "rec_yards"
              }
              assert required.issubset(reader.fieldnames or []), "Missing required columns"
              rows = list(reader)

          assert len(rows) >= 1000, "Unexpectedly small export"
          print(f"Export validated: {len(rows)} rows")
          print(f"Columns: {len(reader.fieldnames)}")
          print("SAFE TEST: No Supabase upload performed")
          PY

      - name: Downloadable CSV test artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfl-stats-test-export
          path: nfl_player_stats.csv
          retention-days: 7
