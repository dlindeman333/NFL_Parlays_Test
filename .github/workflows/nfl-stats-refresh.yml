name: NFL stats refresh (Phase 3A)
on:
  workflow_dispatch:
  schedule:
    # UTC; runs daily in season, including Tuesdays after Monday games.
    - cron: '35 12 * 9-12,1-2 *'
permissions:
  contents: read
concurrency:
  group: nfl-stats-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-phase3.txt
      - name: Install exporter dependencies
        run: pip install -r requirements-phase3.txt
      - name: Export weekly NFL stats
        run: python export.py
      - name: Upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_stats.py
