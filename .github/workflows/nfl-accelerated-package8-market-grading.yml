name: NFL Accelerated Package 8 - Market-Aware Grading (Read Only)
on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: '2026'
      week:
        description: NFL week
        required: true
        default: '9'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NFL_SEASON: ${{ inputs.season }}
      NFL_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run market grading regression tests
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_nfl_package8_market_grader.py' -v
      - name: Run market-aware grading preview
        run: python scripts/nfl_package8_market_grader.py
      - name: Upload grading evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-package8-market-grading-${{ github.run_id }}
          path: package8-output/market_aware_grading.json
          if-no-files-found: warn
          retention-days: 14
