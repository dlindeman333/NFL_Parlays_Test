name: NFL Phase 3D35 Live Evidence (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out automation development branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run safety tests
        run: python -m unittest discover -s scripts -p 'test_phase3d35_live_evidence.py' -v
      - name: Collect live evidence (GET and HEAD only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3d35_live_evidence.py
      - name: Upload read-only report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d35-live-evidence-readonly
          path: phase3d35_live_evidence_report.json
          if-no-files-found: warn
