name: NFL Accelerated Package 3 - Live Read Only Grading Audit
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season'
        required: true
        default: '2026'
        type: string
      week:
        description: 'Week with existing snapshots and completed games'
        required: true
        default: '9'
        type: string
permissions:
  contents: read
concurrency:
  group: nfl-package3-live-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests
        run: python -m unittest discover -s scripts -p 'test_nfl*grader.py' -v && python -m unittest discover -s scripts -p 'test_nfl_package3_live_audit.py' -v
      - name: Live Supabase read only grading audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: ${{ inputs.season }}
          NFL_WEEK: ${{ inputs.week }}
        run: python scripts/nfl_package3_live_audit.py
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-package3-grading-audit-${{ github.run_id }}
          path: package3-output/grading_audit.json
          if-no-files-found: warn
