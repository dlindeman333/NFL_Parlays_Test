name: NFL Phase 3C-3D22 Initial Injury Load Preview (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preview injury load with verified ESPN schedule mapping
        run: python scripts/phase3c3d22_initial_load_preview.py
      - name: Upload diagnostic report even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3c3d22-initial-load-preview-report
          path: phase3c3d22-report/
          if-no-files-found: warn
