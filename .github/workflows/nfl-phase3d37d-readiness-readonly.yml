name: NFL Phase 3D37D Point-in-Time Readiness (Read Only)
on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: '2026'
      week:
        description: NFL week
        required: true
        default: '10'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_phase3d37d_readiness.py' -v
      - name: Read-only readiness audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/phase3d37d_readiness.py --season "${{ inputs.season }}" --week "${{ inputs.week }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3d37d-readiness-report
          path: phase3d37d_readiness_report.json
          if-no-files-found: warn
