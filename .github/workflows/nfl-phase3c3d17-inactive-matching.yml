name: NFL Phase 3C-3D17 Official Inactive Matching (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4==4.12.3
      - name: Run read-only historical article audit
        run: python scripts/phase3c3d17_inactive_matching.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3c3d17-inactive-matching-report
          path: phase3c3d17-report/
          if-no-files-found: warn
