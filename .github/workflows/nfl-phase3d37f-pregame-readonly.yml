name: NFL Phase 3D37F Scheduled Pregame Preview (Read Only)
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (blank = ESPN current season)'
        required: false
        type: string
      week:
        description: 'Week (blank = ESPN current week)'
        required: false
        type: string
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
concurrency:
  group: phase3d37f-pregame-readonly
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'dlindeman333/NFL_Parlays_Test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_phase3d37f_pregame.py' -v
      - name: Verify TEST-only privileged credential boundary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python scripts/phase3_test_boundary.py
      - name: Build read-only preview
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: ${{ inputs.season }}
          NFL_WEEK: ${{ inputs.week }}
        run: |
          args=()
          if [[ -n "$NFL_SEASON" ]]; then args+=(--season "$NFL_SEASON"); fi
          if [[ -n "$NFL_WEEK" ]]; then args+=(--week "$NFL_WEEK"); fi
          python scripts/phase3d37f_pregame.py "${args[@]}" --max-export-age-hours 12
      - name: Upload report only (no raw CSV)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d37f-pregame-preview-${{ github.run_id }}
          path: phase3d37f-report.json
          if-no-files-found: error
          retention-days: 30
